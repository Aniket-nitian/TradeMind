services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trademind
      POSTGRES_PASSWORD: trademind
      POSTGRES_DB: trademind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - services/api/.env
    environment:
      DATABASE_URL: postgresql://trademind:trademind@postgres:5432/trademind
      CLIENT_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build:
      context: services/ai
      dockerfile: Dockerfile
    env_file:
      - services/ai/.env
    environment:
      API_URL: http://api:5000
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_AI_URL: http://localhost:8000/api/v1
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    environment:
      API_PROXY_TARGET: http://api:5000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ai

volumes:
  postgres-data:
