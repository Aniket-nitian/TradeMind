# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys:
#   - trademind-api : Node/Express backend (Docker, free web service)
#   - trademind-ai  : FastAPI AI service (Docker, free web service)
#   - trademind-web : React frontend (static site, free + unmetered)
#
# Postgres is NOT declared here — this project uses a free Neon project
# instead of Render's free Postgres (Neon doesn't expire after 30 days).
# Create that separately at neon.tech and paste its connection string into
# trademind-api's DATABASE_URL below.
#
# Any envVar with `sync: false` must be filled in manually from the Render
# dashboard after the first deploy — never commit real secrets here.

services:
  - type: web
    name: trademind-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXPIRES
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES
        value: 30d
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: CLIENT_URL
        sync: false # https://trademind-web.onrender.com once deployed
      - key: CORS_ORIGIN
        sync: false # same as CLIENT_URL
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BROKER_ENCRYPTION_KEY
        sync: false # must be exactly 64 hex chars
      - key: GOOGLE_CLIENT_ID
        sync: false # OAuth Client ID from Google Cloud Console (same one as VITE_GOOGLE_CLIENT_ID below)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: trademind-ai
    runtime: docker
    dockerfilePath: ./services/ai/Dockerfile
    dockerContext: ./services/ai
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GOOGLE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-flash-latest
      - key: TEMPERATURE
        value: 0.2
      - key: API_URL
        sync: false # https://trademind-api.onrender.com
      - key: CORS_ORIGIN
        sync: false # https://trademind-web.onrender.com

  - type: web
    name: trademind-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --filter web... && pnpm --filter web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # https://trademind-api.onrender.com/api/v1
      - key: VITE_AI_URL
        sync: false # https://trademind-ai.onrender.com/api/v1
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # same value as GOOGLE_CLIENT_ID on trademind-api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
